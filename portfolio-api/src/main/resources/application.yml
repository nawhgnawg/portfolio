spring:
  application:
    name: portfolio-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/portfolio;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
  h2:
    console:
      enabled: false

server:
  port: 8080

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8000,http://127.0.0.1:8000}
  admin:
    username: ${PORTFOLIO_ADMIN_USERNAME:admin}
    password: ${PORTFOLIO_ADMIN_PASSWORD:1233}
