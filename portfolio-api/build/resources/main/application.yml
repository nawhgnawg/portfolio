spring:
  application:
    name: portfolio-api
  datasource:
    url: jdbc:h2:file:./data/portfolio;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:8000,http://127.0.0.1:8000
  admin:
    username: ${PORTFOLIO_ADMIN_USERNAME:admin}
    password: ${PORTFOLIO_ADMIN_PASSWORD:1233}
